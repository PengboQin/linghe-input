__build_info:
  rime_version: 1.17.0
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
menu:
  page_size: 7
punctuator:
  half_shape:
    "!": "！"
    ",": "，"
    .: "。"
    ":": "："
    ";": "；"
    "?": "？"
schema:
  author:
    - "Private Input"
  name: "内部完整拼音验证"
  schema_id: private_pinyin_exact
  version: 0.2.0
speller:
  algebra:
    - "derive/^([nl])ve$/$1ue/"
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "英文"]
translator:
  always_show_comments: true
  dictionary: private_pinyin
  enable_completion: true
  enable_sentence: true
  enable_user_dict: false
  prism: private_pinyin_exact
  spelling_hints: 100