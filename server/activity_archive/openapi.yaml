openapi: 3.1.0
info:
  title: PrivateInput Plaintext Activity Archive
  version: 1.0.0
  description: |
    Optional single-distribution, self-hosted archive. Server stores readable text.
    Group policy defaults OFF; every device explicitly grants provider capture and
    reader access. This service is separate from encrypted relay message storage.
    All authenticated operations use Ed25519 signed POST RPC, not URL credentials.
    Exact decoded body and result definitions are in CONTRACT.md shipped alongside.
paths:
  /v1/activity/capabilities:
    get:
      operationId: activityCapabilities
      summary: Public protocol and bounded capture capabilities, no group data
      responses:
        '200':
          description: Protocol v1 limits and default-off/server-plaintext boundary
          content:
            application/json:
              schema:
                type: object
                required: [protocol, version, storage, default_enabled]
                properties:
                  protocol: {const: private-input-activity}
                  version: {const: 1}
                  storage: {const: server_plaintext}
                  default_enabled: {const: false}
                  max_wrapper_bytes: {const: 1048576}
                  max_body_bytes: {const: 524288}
                  max_event_bytes: {const: 262144}
                  max_batch_events: {const: 128}
                  operations:
                    type: array
                    items: {type: integer, minimum: 1, maximum: 11}
  /v1/activity/rpc:
    post:
      operationId: signedActivityOperation
      summary: Current-member signed archive RPC
      description: |
        Maximum wrapper 1MiB, decoded body 512KiB. Verify current relay membership,
        anchored lineage, device departure/idle expiry and signature on every call.
        Canonical signature bytes:
        UTF8("PrivateInput/activity-request/v1\0") || 01 || group.UUID16 ||
        sender.UUID16 || nonce.UUID16 || issuedAt.BE64 || operation.byte || SHA256(body).
        issuedAt must be within 300 seconds of server; nonce cannot repeat within
        600 seconds. UUID strings are canonical (case-insensitive); response IDs uppercase.
        Decoded operation body is UTF-8 JSON, integers only, duplicate keys rejected.
        Operations:
        1 status: {}.
        2 set_group_policy: {expected_version,enabled,retention_days,max_group_bytes}.
        3 set_device_consent: {expected_version,enabled,providers,readers?}.
        4 ingest: {batch_id,events:[ActivityEvent]} (atomic 1..128).
        5 query: {limit?,cursor?,filters?}.
        6 changes: {limit?,cursor?}.
        7 snapshot: query body; result adds snapshot:true,changes_cursor.
        8 export: query body; result format:jsonl,jsonl,next_cursor,high_watermark.
        9 erase: {event_ids:[UUID]} (self-owned only; permanent tombstones).
        10 paragraphs: query body; observed fragments/explicit anchors, never final document.
        11 register_capture_key: {expected_consent_version,public_key(base64 public32)}.
        Only primary member signature registers a capture delegate. Delegate signatures
        authorize only status(1)/ingest(4), bound to active consent and primary fingerprint.
        Filters: device_id,event_type,provider_id,observed_from,observed_to.
        Cursors bind group, reader, membership/current active set and policy/consent ACL
        versions, filters and query watermark; expiry 24h. Late offline arrivals appear
        by receive-order changes, never solely device-clock order.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignedRequest'}
      responses:
        '200':
          description: Durable success; ingest ACK IDs are exact, never max-seq-only
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, operation, result]
                properties:
                  version: {const: 1}
                  operation: {type: integer, minimum: 1, maximum: 11}
                  result: {type: object}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
        '507': {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: |
        Bounded machine code; no text bodies/credentials echoed. Includes archive_disabled,
        consent_disabled,consent_stale,member_inactive,event_conflict,sequence_conflict,
        event_erased,cursor_stale,cursor_expired,group_capacity,request_clock,replay.
      content:
        application/json:
          schema:
            type: object
            required: [version, error]
            additionalProperties: false
            properties:
              version: {const: 1}
              error: {type: string, maxLength: 96}
  schemas:
    SignedRequest:
      type: object
      additionalProperties: false
      required: [version, group, sender, nonce, issuedAt, operation, body, signature]
      properties:
        version: {const: 1}
        group: {type: string, format: uuid}
        sender: {type: string, format: uuid}
        nonce: {type: string, format: uuid}
        issuedAt: {type: integer, minimum: 0, maximum: 18446744073709551615}
        operation: {type: integer, minimum: 1, maximum: 11}
        body: {type: string, contentEncoding: base64, contentMediaType: application/json}
        signature: {type: string, contentEncoding: base64, minLength: 88, maxLength: 88}
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [schema_version, event_id, device_group, device_id, installation_id, device_seq, provider_id, event_type, observed_at, content, consent_version]
      properties:
        schema_version: {const: 1}
        event_id: {type: string, format: uuid}
        device_group: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        installation_id: {type: string, format: uuid}
        device_seq: {type: integer, minimum: 1, maximum: 9223372036854775807}
        provider_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$'}
        event_type:
          enum: [input_commit, clipboard_observed, paste_action, text_revise, text_retract, source_import, coverage_gap]
        observed_at: {type: string, format: date-time}
        consent_version: {type: integer, minimum: 1}
        content:
          type: object
          additionalProperties: false
          required: [text]
          properties:
            text: {type: string, description: Complete exact Unicode text, no silent normalization or truncation}
        timezone_id: {type: [string, 'null'], maxLength: 256}
        utc_offset_minutes: {type: integer, minimum: -1440, maximum: 1440}
        input_session: {type: [string, 'null'], maxLength: 256}
        editor_epoch: {type: [string, 'null'], maxLength: 256}
        span_id: {type: [string, 'null'], maxLength: 256}
        edit_op: {type: [object, 'null']}
        source_kind: {type: [string, 'null'], maxLength: 256}
        source_app: {type: [string, 'null'], maxLength: 256}
        document_id: {type: [string, 'null'], maxLength: 256}
        delivery_state: {type: [string, 'null'], maxLength: 256}
        commit_confirmation: {type: [string, 'null'], maxLength: 256}
        sensitivity: {type: [string, 'null'], maxLength: 256}
        time_quality: {type: [string, 'null'], maxLength: 256}
        links: {type: array, maxItems: 64}
        extensions: {type: object, maxProperties: 32}
