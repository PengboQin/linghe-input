__build_info:
  rime_version: 1.17.0
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
key_binder:
  bindings:
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
menu:
  alternative_select_keys: ABCDEFGHI
  page_size: 7
punctuator:
  half_shape:
    "!": "！"
    "(": "（"
    ")": "）"
    ",": "，"
    .: "。"
    ":": "："
    ";": "；"
    "?": "？"
schema:
  author:
    - "Private Input"
  name: "灵鹤九宫格"
  schema_id: private_nine_private
  version: 0.2.0
speller:
  algebra:
    - "derive/^([a-z]+)$/\\U$1/"
    - "xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/"
    - "xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/"
  alphabet: abcdefghijklmnopqrstuvwxyz23456789
  delimiter: " '"
switches:
  - name: ascii_mode
    reset: 0
    states: ["中文", "英文"]
translator:
  always_show_comments: true
  dictionary: private_pinyin
  enable_completion: true
  enable_sentence: true
  enable_user_dict: false
  prism: private_nine
  spelling_hints: 100