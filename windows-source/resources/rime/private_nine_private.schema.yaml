schema:
  schema_id: private_nine_private
  name: 灵鹤九宫格
  version: '0.2.0'
  author: [Private Input]
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz23456789"
  algebra:
    - derive/^([a-z]+)$/\U$1/
    - xlit/abcdefghijklmnopqrstuvwxyz/22233344455566677778889999/
    - xlit/ABCDEFGHIJKLMNOPQRSTUVWXYZ/abcdefghijklmnopqrstuvwxyz/
  delimiter: " '"
translator:
  always_show_comments: true
  dictionary: private_pinyin
  prism: private_nine
  enable_user_dict: false
  enable_sentence: true
  enable_completion: true
  spelling_hints: 100
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
    '(': '（'
    ')': '）'
key_binder:
  bindings:
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}

menu:
  alternative_select_keys: "ABCDEFGHI"
