schema:
  schema_id: private_pinyin
  name: 灵鹤拼音
  version: '0.3.0'
  author: [Private Input]
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  algebra:
    - derive/^([nl])ve$/$1ue/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
  delimiter: " '"
translator:
  always_show_comments: true
  dictionary: private_pinyin
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
  spelling_hints: 100
punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'
    ':': '：'
    ';': '；'
    '(': '（'
    ')': '）'
key_binder:
  bindings:
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
